name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHY: Markdownのみの変更(docs・skill・PRテンプレート)では build/lint/typecheck/test の
  # 結果が変わらないのに、testジョブだけで毎回2分40秒(ローカルSupabase起動込み)かかる。
  # 2026-08-25にActions無料枠(private 2,000分/月)を使い切りCIが全停止した実例があり、
  # 消費の一因がこれだった(issue #94)。ここで変更ファイルを判定し、重いジョブだけ落とす。
  # hooks-testは対象外(常に実行)にしている。scripts/codex-aidd-port.test.shが
  # .agents/skills/feature-proposal/SKILL.md を検証しており、これは.mdファイルのため
  # 一律スキップすると検証まで飛んでしまうため。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Detect non-markdown changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}')"
          echo "changed files:"
          echo "$changed"
          # 1件でも.md以外が含まれていれば重いジョブを実行する。
          # 変更ファイルが空のときもgrep -vが空行にマッチしてcode=trueになる(安全側)。
          if echo "$changed" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  hooks-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # WHY: .claude/settings.jsonから呼ばれるhookスクリプト(scripts/check-*.sh等)には
      # 個別の回帰テスト(scripts/*.test.sh)を用意している。テストされないまま放置すると
      # 劣化に気づけない(issue #57・#58・#59・#60はレビューで見つかったが、CIには
      # まだ組み込まれていなかった)ため、ここで機械的に全件実行する。
      - name: Run hook script regression tests
        run: |
          for t in scripts/*.test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/node-check.yml
    with:
      run-script: typecheck

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/node-check.yml
    with:
      run-script: lint

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/node-check.yml
    with:
      run-script: build

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # WHY: 並行して作業する複数PRが同じマイグレーション連番を選んでしまい、
      # supabase db resetがschema_migrationsの主キー重複で失敗する事故が2度起きた(issue #43)。
      # 重いSupabase起動の前に、連番の重複を機械的に検知して早期に落とす。
      - name: Check for duplicate migration version numbers
        run: |
          cd supabase/migrations
          dupes=$(ls *.sql | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::重複したマイグレーション番号があります: $dupes"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11.6.2
      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # WHY: 本番Supabaseの接続情報をCIに一切渡さないため、GitHub Secretsは使わず
      # ローカルSupabaseをその場で起動し、発行される接続情報だけをテストに渡す。
      # (medical-inventory-vkumaiリポジトリのe2e.ymlを踏襲)
      - name: Start local Supabase
        run: |
          supabase start
          supabase db reset

      - name: Export local Supabase connection info
        run: |
          echo "SUPABASE_API_URL=$(supabase status -o json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
